name: Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: WatchUnlock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows client, service and login provider
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows BLE client
        run: dotnet publish windows/WatchUnlock.BleClient/WatchUnlock.BleClient.csproj --configuration Release --runtime win-x64 --self-contained true --output dist/windows-ble
      - name: Publish Windows background service
        run: dotnet publish windows/WatchUnlock.Service/WatchUnlock.Service.csproj --configuration Release --runtime win-x64 --self-contained true --output dist/windows-ble/service
      - name: Configure Windows login provider
        run: cmake -S windows/WatchUnlock.CredentialProvider -B .build/credential-provider -A x64
      - name: Build Windows login provider
        run: cmake --build .build/credential-provider --config Release
      - name: Include deployment files
        run: |
          New-Item -ItemType Directory -Path dist/windows-ble/credential-provider -Force | Out-Null
          Copy-Item .build/credential-provider/Release/WatchUnlock.CredentialProvider.dll -Destination dist/windows-ble/credential-provider
          Copy-Item windows/install-service.ps1, windows/uninstall-service.ps1, windows/install-login.ps1, windows/uninstall-login.ps1, windows/open-setup.cmd -Destination dist/windows-ble
      - name: Upload Windows BLE client
        uses: actions/upload-artifact@v7.0.2
        with:
          name: WatchUnlock-Windows-BLE-client
          path: dist/windows-ble/
          if-no-files-found: error
          retention-days: 14
